# Rendered from the tools template: change it there, then `copier update`.
# The same pinned toolchain (flake.lock) and the same gate (`just check`) as local.
name: checks

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Upstream Nix, with flakes enabled.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix develop --command just check

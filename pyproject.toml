[project]
name = "tools"
version = "0.1.0"
description = "Tests of the configuration template this repository distributes"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.40",
  "pytest>=9.1",
  "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
  "integration: renders a project and runs its gate inside its own devShell (slow, needs network)",
]

# Rendered from the tools template: change it there, then `copier update`.
# Read by `just check` and by the editors' Ruff. It takes precedence over any
# [tool.ruff] table in pyproject.toml, which Ruff then ignores.
line-length = 120
target-version = "py312"

[lint]
# ANN: annotations and explicit Any (ANN401). basedpyright checks them too today;
# ruff keeps them once basedpyright goes, since ty does not.
select = ["E", "W", "F", "I", "UP", "B", "PT", "RUF", "SIM", "ANN"]
